[build-system]
requires = ["maturin>=1.5,<2"]
build-backend = "maturin"

[project]
name = "gendoc-md"
version = "0.1.0"
description = "Generate nested Markdown API maps for local Python projects."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "gendoc-md contributors" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Programming Language :: Rust",
  "Programming Language :: Python :: 3",
  "Topic :: Documentation",
  "Topic :: Software Development :: Documentation",
]

[project.urls]
Homepage = "https://github.com/your-org/gendoc-md"

[tool.maturin]
bindings = "bin"
manifest-path = "Cargo.toml"
strip = true
