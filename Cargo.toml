[package]
name = "gendoc-md"
version = "0.1.1"
edition = "2024"
authors = ["Peilin Fan <peilin.fan@foxmail.com>"]
description = "Generate nested Markdown API maps for local Python projects."
license = "MIT"
repository = "https://github.com/fansion314/gendoc-md"
readme = "README.md"

[[bin]]
name = "gendoc-md"
path = "src/main.rs"

[lib]
name = "gendoc_md"
path = "src/lib.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
ignore = "0.4"
num_cpus = "1.16"
rayon = "1.10"
ruff_python_ast = { version = "0.15.8", package = "rustpython-ruff_python_ast" }
ruff_python_parser = { version = "0.15.8", package = "rustpython-ruff_python_parser" }
ruff_text_size = { version = "0.15.8", package = "rustpython-ruff_text_size" }
thiserror = "2.0"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
tempfile = "3.10"
